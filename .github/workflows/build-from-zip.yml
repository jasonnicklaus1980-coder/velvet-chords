# Builds the MPC (32-bit ARM) plugin on GitHub's servers, runs the tests, and packages the installer zip.
# Two independent routes run side by side; either one succeeding gives you the plugin:
#   zig    - self-contained Zig compiler targeting glibc 2.17 (no Debian packages needed)
#   debian - Debian 11 cross compiler
# If a step fails, its last lines appear under Annotations (readable on a phone).
# Download: Actions > the run > Artifacts. Tags like v1.0.0 also publish a GitHub Release (zig route).
name: Build MPC plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  zig:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: |
          # helper: run a command; on failure, show its last lines as an annotation
          cat > /tmp/run.sh <<'SH'
          title="$1"; shift
          log=$(mktemp); "$@" >"$log" 2>&1; rc=$?; cat "$log"
          if [ "$rc" -ne 0 ]; then
            t=$(tail -n 15 "$log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=${title} failed (exit ${rc})::${t}"
          fi
          exit "$rc"
          SH
          sh /tmp/run.sh "Download Zig" sh -c 'curl -sSfL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ'
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Native build and tests
        run: sh /tmp/run.sh "Native tests" make test

      - name: ARM build (zig, glibc 2.17)
        run: |
          mkdir -p build/arm
          sh /tmp/run.sh "ARM build" zig cc -target arm-linux-gnueabihf.2.17 -mcpu=cortex_a7 -std=gnu99 -O2 \
            -fPIC -fvisibility=hidden -fno-strict-aliasing -shared -o build/arm/velvetchords.so src/*.c \
            -Wl,-z,defs -ldl -s
          sh /tmp/run.sh "ARM test host build" zig cc -target arm-linux-gnueabihf.2.17 -mcpu=cortex_a7 -std=gnu99 -O1 \
            -o build/arm/test_host tests/test_host.c -ldl -lm -lpthread

      - name: Check the ARM binary
        run: |
          sh /tmp/run.sh "Binary check" sh -c '
            so=build/arm/velvetchords.so
            readelf -h $so | grep -E "Class|Machine|Flags"
            readelf -h $so | grep -q ELF32 || { echo "not 32-bit"; exit 1; }
            readelf -h $so | grep -q ARM || { echo "not ARM"; exit 1; }
            readelf --dyn-syms -W $so | grep -q " VSTPluginMain$" || { echo "VSTPluginMain not exported"; exit 1; }
            readelf -d $so | grep NEEDED
            v=$(readelf --dyn-syms -W $so | grep -o "GLIBC_[0-9.]*" | sort -u); echo "$v"
            for x in $v; do m=$(echo $x | sed "s/GLIBC_2\.\([0-9]*\).*/\1/"); [ "$m" -le 17 ] || { echo "needs $x"; exit 1; }; done'

      - name: Plugin test under ARM emulation (optional)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user libc6-armhf-cross >/dev/null || exit 0
          sh /tmp/run.sh "ARM emulation test" sh -c 'VC_EXPORT_DIR=/tmp/vc-arm qemu-arm -L /usr/arm-linux-gnueabihf build/arm/test_host build/arm/velvetchords.so /tmp/vc-arm-demo'

      - name: Package installer zip
        run: sh /tmp/run.sh "Package" sh scripts/release.sh 1.0.0

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetChords-MPC
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  debian:
    runs-on: ubuntu-latest
    continue-on-error: true
    container: debian:bullseye
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          if ! apt-get update -qq; then
            echo "Debian 11 mirrors unavailable: switching to archive.debian.org"
            printf "%s\n" "deb http://archive.debian.org/debian bullseye main" \
              "deb http://archive.debian.org/debian-security bullseye-security main" > /etc/apt/sources.list
            rm -f /etc/apt/sources.list.d/*
            apt-get -o Acquire::Check-Valid-Until=false update -qq
          fi
          apt-get install -y -qq --no-install-recommends ca-certificates gcc libc6-dev gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross binutils-arm-linux-gnueabihf make python3 zip

      - name: Native build, tests, ARM build and package
        run: make release

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetChords-MPC-debian
          path: dist/*.zip
