# Builds the MPC plugin from the commit that was pushed (or the branch chosen for a manual run).
name: Build from zip

on:
  push:
    branches: [main, keygroups-prep]
  workflow_dispatch:

jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the checked-out project
        run: |
          echo "PROJECT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          ls "$GITHUB_WORKSPACE"

      - name: Download Zig
        run: |
          curl -sSfL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Native build and tests
        working-directory: ${{ env.PROJECT }}
        run: make test

      - name: ARM build (zig, glibc 2.17)
        working-directory: ${{ env.PROJECT }}
        run: |
          mkdir -p build/arm
          zig cc -target arm-linux-gnueabihf.2.17 -mcpu=cortex_a7 -std=gnu99 -O2 \
            -fPIC -fvisibility=hidden -fno-strict-aliasing -shared -o build/arm/velvetchords.so src/*.c \
            -Wl,-z,defs -ldl -s
          zig cc -target arm-linux-gnueabihf.2.17 -mcpu=cortex_a7 -std=gnu99 -O1 \
            -o build/arm/test_host tests/test_host.c src/chords.c -ldl -lm -lpthread

      - name: Check the ARM binary
        working-directory: ${{ env.PROJECT }}
        run: sh scripts/check_so.sh build/arm/velvetchords.so

      - name: Package installer zip
        working-directory: ${{ env.PROJECT }}
        run: sh scripts/release.sh 1.0.0

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetChords-MPC
          path: ${{ env.PROJECT }}/dist/*.zip

  windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Zig
        run: |
          curl -sSfL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Build the Windows DLL
        run: make win ZIG=zig

      - name: Install Wine and Xvfb for the Windows test
        run: sudo apt-get update -q && sudo apt-get install -y -q wine64 xvfb

      - name: Run the Windows DLL in a VST2 host under Wine
        env:
          WINEDEBUG: "-all"
          WINEPREFIX: "/tmp/wineprefix"
        run: make win-test ZIG=zig

      - name: Package the Windows zip
        run: |
          rm -rf dist/win && mkdir -p dist/win/skin
          cp build/win/velvetchords.dll dist/win/
          cp "package/skin/Velvet Chords - VST - Velvet Chords"/*.png dist/win/skin/
          cp package/windows/README.txt dist/win/
          cd dist && zip -qr VelvetChords-Windows-x64.zip win

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetChords-Windows
          path: dist/VelvetChords-Windows-x64.zip

      - name: Publish the Windows zip as the windows-preview pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/keygroups-prep'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-preview --yes --cleanup-tag 2>/dev/null || true
          gh release create windows-preview dist/VelvetChords-Windows-x64.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Velvet Chords for Windows (preview)" \
            --notes "Built from commit $GITHUB_SHA by the build-from-zip workflow. Tested under Wine only, not yet in a Windows DAW. Unzip, keep the skin folder beside velvetchords.dll, and see the README inside."
