# Builds the MPC plugin from the commit that was pushed (or the branch chosen for a manual run).
name: Build from zip

on:
  push:
    branches: [main, keygroups-prep]
  workflow_dispatch:

jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the checked-out project
        run: |
          echo "PROJECT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          ls "$GITHUB_WORKSPACE"

      - name: Download Zig
        run: |
          curl -sSfL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Native build and tests
        working-directory: ${{ env.PROJECT }}
        run: make test

      - name: ARM build (zig, glibc 2.17)
        working-directory: ${{ env.PROJECT }}
        run: |
          mkdir -p build/arm
          zig cc -target arm-linux-gnueabihf.2.17 -mcpu=cortex_a7 -std=gnu99 -O2 \
            -fPIC -fvisibility=hidden -fno-strict-aliasing -shared -o build/arm/velvetchords.so src/*.c \
            -Wl,-z,defs -ldl -s
          zig cc -target arm-linux-gnueabihf.2.17 -mcpu=cortex_a7 -std=gnu99 -O1 \
            -o build/arm/test_host tests/test_host.c src/chords.c -ldl -lm -lpthread

      - name: Check the ARM binary
        working-directory: ${{ env.PROJECT }}
        run: sh scripts/check_so.sh build/arm/velvetchords.so

      - name: Package installer zip
        working-directory: ${{ env.PROJECT }}
        run: sh scripts/release.sh 1.0.0

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetChords-MPC
          path: ${{ env.PROJECT }}/dist/*.zip
